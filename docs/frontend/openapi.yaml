  /forum/winner-submissions:
    post:
      tags: [Forum]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses: { "201": { description: Created } }
    get:
      tags: [Forum]
      summary: All submissions (admin only)
      responses: { "200": { description: OK } }

  /forum/winner-submissions/mine:
    get:
      tags: [Forum]
      responses: { "200": { description: OK } }

  # -------------------------------------------------------- Payments (shared)
  /payments/transactions:
    get:
      tags: [AdCampaigns]
      summary: Brand's own transaction history
      responses: { "200": { description: OK } }

  /payments/webhook/paystack:
    post:
      tags: [AdCampaigns]
      security: []
      summary: Paystack webhook — called by Paystack, not the frontend
      responses: { "200": { description: OK } }

  # -------------------------------------------------------- Wallet top-up
  /wallet/topup/initialize:
    post:
      tags: [Wallet]
      summary: Start a Paystack checkout to fund a brand's wallet (brand only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount, email], properties: { amount: { type: number }, email: { type: string } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      authorization_url: { type: string }
                      access_code: { type: string }
                      reference: { type: string }
                      amount: { type: number }
                      currency: { type: string }

  /wallet/topup/verify/{reference}:
    get:
      tags: [Wallet]
      summary: Confirm a wallet top-up payment and credit the balance (brand only)
      parameters: [{ name: reference, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  transaction: { type: object, properties: { reference: { type: string }, amount: { type: number }, status: { type: string } } }

  # -------------------------------------------------------- Business KYC
  /kyc/submit:
    post:
      tags: [BusinessKYC]
      summary: Submit a business for CAC verification (brand only, multipart) — always lands on pending_review, never auto-verified
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [rcNumber, legalBusinessName]
              properties:
                rcNumber: { type: string }
                businessType: { type: string, enum: [RC, BN, IT] }
                legalBusinessName: { type: string }
                repIdType: { type: string }
                cacCertificate: { type: string, format: binary }
                repId: { type: string, format: binary }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, kyc: { $ref: "#/components/schemas/BusinessKyc" } } } } } }
        "409": { $ref: "#/components/responses/Error" }

  /kyc/me:
    get:
      tags: [BusinessKYC]
      summary: The calling business's most recent KYC submission, if any (brand only)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, kyc: { $ref: "#/components/schemas/BusinessKyc" } } } } } }

  /kyc/resubmit:
    post:
      tags: [BusinessKYC]
      summary: Resubmit after a rejection (brand only, multipart) — 400 KYC_RESUBMIT_NOT_ALLOWED unless current status is rejected
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [rcNumber, legalBusinessName]
              properties:
                rcNumber: { type: string }
                businessType: { type: string, enum: [RC, BN, IT] }
                legalBusinessName: { type: string }
                repIdType: { type: string }
                cacCertificate: { type: string, format: binary }
                repId: { type: string, format: binary }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, kyc: { $ref: "#/components/schemas/BusinessKyc" } } } } } }

  /admin/kyc/queue:
    get:
      tags: [BusinessKYC]
      summary: Pending KYC submissions, oldest first (admin only)
      responses: { "200": { description: OK } }

  /admin/kyc/{id}:
    get:
      tags: [BusinessKYC]
      summary: Full detail of one KYC submission, including the automated check's raw response (admin only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /admin/kyc/{id}/approve:
    post:
      tags: [BusinessKYC]
      summary: Verify a pending KYC submission (admin only, no body)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /admin/kyc/{id}/reject:
    post:
      tags: [BusinessKYC]
      summary: Reject a pending KYC submission (admin only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses: { "200": { description: OK } }

  /admin/brands/{brandId}/kyc/revoke:
    post:
      tags: [BusinessKYC]
      summary: Pull a previously-verified business back to revoked (admin only)
      parameters: [{ name: brandId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Error" }

  # -------------------------------------------------------- Projects & Quotations
  /projects:
    post:
      tags: [Projects]
      summary: Post a project (brand only, KYC-verified only — 403 KYC_REQUIRED otherwise)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title: { type: string }
                description: { type: string }
                budgetMin: { type: number }
                budgetMax: { type: number }
                currency: { type: string }
                category: { type: string }
                deadline: { type: string, format: date-time }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, project: { $ref: "#/components/schemas/Project" } } } } } }
        "403": { $ref: "#/components/responses/Error" }
    get:
      tags: [Projects]
      summary: Browse open projects (brand only)
      parameters: [{ name: category, in: query, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /projects/mine:
    get:
      tags: [Projects]
      summary: The poster's own projects, any status (brand only)
      responses: { "200": { description: OK } }

  /projects/{id}:
    get:
      tags: [Projects]
      summary: One project's detail (brand or admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /projects/{id}/close:
    post:
      tags: [Projects]
      summary: Close a project to new quotations (brand only, poster only, no body)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /projects/{id}/cancel:
    post:
      tags: [Projects]
      summary: Cancel a project (brand only, poster only, no body)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /projects/{id}/quotations:
    get:
      tags: [Projects]
      summary: The paywall-filtered quotation list (brand only, poster only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  quotations: { type: array, items: { $ref: "#/components/schemas/Quotation" } }
                  unlocked: { type: boolean }
                  totalQuotationCount: { type: integer }
    post:
      tags: [Projects]
      summary: Submit a quotation (brand only, KYC-verified only — 403 KYC_REQUIRED otherwise; can't quote your own project)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, message]
              properties:
                amount: { type: number }
                message: { type: string }
                attachmentUrls: { type: array, items: { type: string } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, quotation: { $ref: "#/components/schemas/Quotation" } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /quotations/{id}/withdraw:
    post:
      tags: [Projects]
      summary: Withdraw a submitted quotation (brand only, own quotation only, no body)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /quotation-unlock/purchase:
    post:
      tags: [Projects]
      summary: Buy (or extend) the account-wide unlock pass — debits the wallet (brand only, no body)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean }, expiresAt: { type: string, format: date-time } } }
        "402": { $ref: "#/components/responses/Error" }

  /quotation-unlock/status:
    get:
      tags: [Projects]
      summary: Whether the calling business currently has an active unlock pass (brand only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean }, active: { type: boolean }, expiresAt: { type: string, format: date-time } } }

  /admin/projects/{id}/quotations:
    get:
      tags: [Projects]
      summary: Every quotation on a project, unfiltered by the paywall (admin only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  # -------------------------------------------------------- Business contact & ratings
  /business-contact/threads:
    post:
      tags: [Projects]
      summary: Open (or return the existing) private thread on a quotation (brand only, poster or quoter, quotation must be visible — 403 QUOTATION_NOT_VISIBLE otherwise)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [projectId, quotationId], properties: { projectId: { type: string }, quotationId: { type: string } } }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Error" }
    get:
      tags: [Projects]
      summary: Every contact thread the calling business participates in (brand only)
      responses: { "200": { description: OK } }

  /business-contact/threads/{id}/messages:
    get:
      tags: [Projects]
      summary: Messages in a thread (brand only, participant only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }
    post:
      tags: [Projects]
      summary: Send a message in a thread (brand only, participant only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string } } }
      responses: { "201": { description: Created } }

  /business-ratings:
    post:
      tags: [Projects]
      summary: Rate a business after contact (brand only — 403 CONTACT_REQUIRED without an existing thread; 409 on a repeat rating for the same project+direction)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, quotationId, ratedBrandId, score]
              properties:
                projectId: { type: string }
                quotationId: { type: string }
                ratedBrandId: { type: string }
                score: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, rating: { $ref: "#/components/schemas/BusinessRating" } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /business-ratings/business/{brandId}:
    get:
      tags: [Projects]
      summary: A business's public rating summary + list (public, no auth)
      security: []
      parameters: [{ name: brandId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  averageScore: { type: number }
                  count: { type: integer }
                  ratings: { type: array, items: { $ref: "#/components/schemas/BusinessRating" } }

  /business-ratings/{id}/report:
    post:
      tags: [Projects]
      summary: Report a rating as false — idempotent per reporter (brand only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean }, reported: { type: boolean }, flagged: { type: boolean } } }

  /admin/business-ratings/moderation/flags:
    get:
      tags: [Projects]
      summary: Ratings currently over the auto-flag report threshold, not yet hidden (admin only)
      responses: { "200": { description: OK } }

  /admin/business-ratings/{id}/hide:
    post:
      tags: [Projects]
      summary: Hide a rating from public view — never deleted (admin only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses: { "200": { description: OK } }

  /admin/business-ratings/reports/{id}/dismiss:
    post:
      tags: [Projects]
      summary: Log that an admin reviewed a report and judged the rating fine — no data mutation (admin only, no body)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The accessToken returned in the JSON body of any auth response.
        access_token/refresh_token httpOnly cookies are also set but every
        protected route in practice reads this header, not the cookie.

  responses:
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        code: { type: string, description: "Machine-readable — branch on this, not on message text" }
        details: { type: object }

    AuthResponse:
      type: object
      properties:
        success: { type: boolean }
        user: { type: object }
        accessToken: { type: string }
        refreshToken: { type: string }

    ActivationPending:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        activationToken: { type: string }

    BillboardSlot:
      type: object
      description: "Shape depends on type. AD/HOUSE carry campaignId/brandName/title/bannerImageUrl (was videoUrl — see MIGRATION_NOTES.md); AD additionally carries clickUrl; FREEBIE carries codeId/publicCode/valueLabel/freebieType/liveUntil instead — a live freebie code taking over this slot full-screen, exactly like a real ad, entirely unchanged by the video->banner revamp. See UI_CONTRACT.md."
      properties:
        slotId: { type: string }
        type: { type: string, enum: [AD, HOUSE, FREEBIE] }
        durationSec: { type: number, description: "Fixed Config: billboard.bannerDisplaySeconds (15s default) for AD/HOUSE." }
        # AD / HOUSE only
        campaignId: { type: string }
        brandName: { type: string }
        title: { type: string }
        bannerImageUrl: { type: string }
        # AD only — campaign's campaignUrl, else brandUrl, else null
        clickUrl: { type: string, nullable: true }
        # FREEBIE only
        codeId: { type: string }
        publicCode: { type: string }
        valueLabel: { type: string }
        freebieType: { type: string, enum: [AIRTIME, CASH] }
        liveUntil: { type: string, format: date-time }

    StripFeedItem:
      type: object
      properties:
        kind: { type: string, enum: [FREEBIE, PROMO] }
        display: { type: string, enum: [PINNED, SCROLLING] }
        positionHint: { type: string, enum: [TOP, BOTTOM, LEFT, RIGHT] }
        codeId: { type: string }
        publicCode: { type: string }
        valueLabel: { type: string }
        type: { type: string, enum: [AIRTIME, CASH] }
        state: { type: string, enum: [AVAILABLE, TAKEN] }
        liveUntil: { type: string, format: date-time }
        text: { type: string }

    StripFeed:
      type: object
      properties:
        serverTime: { type: string, format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/StripFeedItem" } }

    ClaimedResult:
      type: object
      properties:
        success: { type: boolean }
        action: { type: string, enum: [CLAIMED] }
        claimId: { type: string }
        type: { type: string, enum: [AIRTIME, CASH] }
        valueLabel: { type: string }
        secretCode: { type: string }

    RedeemedCashResult:
      type: object
      properties:
        success: { type: boolean }
        action: { type: string, enum: [REDEEMED] }
        claimId: { type: string }
        type: { type: string, enum: [CASH] }
        walletBalance: { type: number }
        redeemedAt: { type: string, format: date-time }

    RedeemedAirtimeResult:
      type: object
      properties:
        success: { type: boolean }
        action: { type: string, enum: [REDEEMED] }
        claimId: { type: string }
        type: { type: string, enum: [AIRTIME] }
        display: { type: string }
        rechargeString: { type: string }
        redeemedAt: { type: string, format: date-time }

    ClaimHistoryItem:
      type: object
      properties:
        claimId: { type: string }
        type: { type: string, enum: [AIRTIME, CASH] }
        value: { type: number }
        currency: { type: string }
        publicCode: { type: string, description: "The board code as it appeared when won" }
        secretCode: { type: string, description: "Always visible to the owner — never has a deadline" }
        status: { type: string, enum: [ISSUED, REDEEMED, VOID] }
        issuedAt: { type: string, format: date-time }
        redeemedAt: { type: string, format: date-time }

    WalletBalance:
      type: object
      properties:
        success: { type: boolean }
        balance: { type: number }
        currency: { type: string }
        payoutThreshold: { type: number }
        amountToThreshold: { type: number }
        nextPayoutDate: { type: string, format: date-time }

    AdminDashboard:
      type: object
      properties:
        success: { type: boolean }
        dashboard:
          type: object
          properties:
            liveViewers: { type: integer }
            verifiedViews:
              type: object
              properties:
                total: { type: integer }
                today: { type: integer }
            activeCampaigns: { type: integer }
            codesLiveNow: { type: integer }
            prizesDistributedToday: { type: integer }
            outstandingWalletLiability: { type: number }
            nextPayoutRun:
              type: object
              properties:
                userCount: { type: integer }
                totalAmount: { type: number }
            profileCompletionFunnel:
              type: object
              properties:
                total: { type: integer }
                verified: { type: integer }
                profileComplete: { type: integer }
            codesDroppedVsClaimed:
              type: object
              properties:
                dropped: { type: integer }
                claimed: { type: integer }
                rotatedUnclaimed: { type: integer }
            averageTimeToClaimSeconds: { type: number, nullable: true }
            airtimeRedemptionRate: { type: number }
            unredeemedClaimsByAge:
              type: object
              properties:
                "<1d": { type: integer }
                "1-7d": { type: integer }
                "7-30d": { type: integer }
                ">30d": { type: integer }

    AdCampaign:
      type: object
      properties:
        success: { type: boolean }
        campaign:
          type: object
          properties:
            _id: { type: string }
            brandId: { type: string }
            tier: { type: string, enum: [basic, premium] }
            title: { type: string }
            description: { type: string }
            bannerImageUrl: { type: string, description: "Was videoUrl — see MIGRATION_NOTES.md." }
            bannerWidthPx: { type: number }
            bannerHeightPx: { type: number }
            status: { type: string, enum: [DRAFT, PENDING_PAYMENT, ACTIVE, PAUSED, EXPIRED, REJECTED] }
            paymentStatus: { type: string, enum: [unpaid, paid] }
            moderationStatus: { type: string, enum: [PENDING, APPROVED, REJECTED] }
            flagged: { type: boolean }
            flaggedAt: { type: string, format: date-time }
            flagReasons: { type: array, items: { type: string } }
            activatedAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            playsToday: { type: integer, description: "GET /ad-campaigns/mine only" }
            completionRateToday: { type: number, nullable: true, description: "GET /ad-campaigns/mine only" }
            reportCount: { type: integer, description: "GET /ad-campaigns (admin) only" }
            reportCountLastHour: { type: integer, description: "GET /ad-campaigns (admin) only" }
            brandStrikeCount: { type: integer, description: "GET /ad-campaigns (admin) only" }
            brandSuspended: { type: boolean, description: "GET /ad-campaigns (admin) only" }

    SponsoredAd:
      type: object
      description: "Admin-curated side-panel creative — see BUSINESS_RULES.md's 'sponsored ad panel' note. Not a brand self-serve product; can arrive via a direct admin upload (ACTIVE immediately) or a public submission via POST /sponsored-ads/submit (PENDING until an admin activates it)."
      properties:
        _id: { type: string }
        imageUrl: { type: string, description: "Image or GIF — never video/audio." }
        widthPx: { type: number }
        heightPx: { type: number }
        advertiserName: { type: string }
        clickUrl: { type: string, nullable: true }
        contactEmail: { type: string, description: "Set only on a brand's own submission." }
        contactPhone: { type: string, description: "Submission only, optional." }
        message: { type: string, description: "Submission only — free text from the advertiser." }
        status: { type: string, enum: [PENDING, ACTIVE, INACTIVE] }
        clickCount: { type: integer }
        createdBy: { type: string, description: "Admin userId — unset on a PENDING submission." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SponsoredAdResponse:
      type: object
      properties:
        success: { type: boolean }
        sponsoredAd: { $ref: "#/components/schemas/SponsoredAd" }

    BusinessSocialLinks:
      type: object
      properties:
        website: { type: string }
        instagram: { type: string }
        facebook: { type: string }
        twitter: { type: string }
        tiktok: { type: string }
        linkedin: { type: string }
        youtube: { type: string }

    BusinessProfile:
      type: object
      description: "brandId is always the brand's User _id, matching AdCampaign.brandId's convention elsewhere in the API."
      properties:
        brandId: { type: string }
        businessName: { type: string }
        businessDescription: { type: string }
        logoUrl: { type: string }
        coverImageUrl: { type: string }
        category: { type: array, items: { type: string } }
        contactEmail: { type: string }
        contactPhone: { type: string }
        whatsappNumber: { type: string }
        address: { type: string }
        country: { type: string }
        state: { type: string }
        city: { type: string }
        socialLinks: { $ref: "#/components/schemas/BusinessSocialLinks" }
        isListed: { type: boolean }

    BusinessProfileResponse:
      type: object
      properties:
        success: { type: boolean }
        profile:
          allOf:
            - $ref: "#/components/schemas/BusinessProfile"
            - type: object
              properties:
                isListable: { type: boolean, description: "Only present on the brand's own profile reads" }

    MarketplaceProduct:
      type: object
      description: A catalogue showcase item, not a purchasable SKU — no price/checkout fields.
      properties:
        _id: { type: string }
        brandId: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        images: { type: array, items: { type: string } }
        priceLabel: { type: string, description: 'Free display text, e.g. "From ₦5,000" — never a charged amount' }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PromoCampaign:
      type: object
      description: A free Promote & Earn posting — no payment, no pre-publish moderation queue.
      properties:
        _id: { type: string }
        brandId: { type: string }
        brandName: { type: string }
        title: { type: string }
        description: { type: string }
        mediaUrl: { type: string }
        mediaType: { type: string, enum: [image, video] }
        videoDurationSeconds: { type: number, description: "video only" }
        status: { type: string, enum: [ACTIVE, PAUSED] }
        likeCount: { type: integer, description: "All-time, informational — not a prize-period total" }
        clickCount: { type: integer, description: "GET /promote/campaigns/mine and admin only — not on the public detail read" }
        signupCount: { type: integer, description: "GET /promote/campaigns/mine and admin only — not on the public detail read" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PromoLink:
      type: object
      description: A viewer's personal, reusable share link for one campaign.
      properties:
        linkId: { type: string }
        campaignId: { type: string }
        slug: { type: string }
        shareUrl: { type: string }
        clickCount: { type: integer, description: "GET /promote/links/mine only — distinct browsers that followed this link" }
        signupCount: { type: integer, description: "GET /promote/links/mine only — of those, how many created an account" }
        likeCount: { type: integer, description: "Likes attributed to THIS link specifically" }
        createdAt: { type: string, format: date-time }

    PromoPrizePeriod:
      type: object
      nullable: true
      description: The platform-wide grand-prize window. Null when no period is currently OPEN.
      properties:
        _id: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        prizeDescription: { type: string }
        prizeAmount: { type: number, description: "Unset = non-cash prize, admin fulfills manually" }
        currency: { type: string }
        status: { type: string, enum: [OPEN, SETTLED, CANCELLED] }
        winnerUserId: { type: string }
        winningLikeTotal: { type: integer }
        settledAt: { type: string, format: date-time }

    PromoLeaderboardEntry:
      type: object
      description: >-
        One promoter's CUMULATIVE like total across every campaign they've shared within the
        period's window — this, not any single campaign's likeCount, decides the grand prize.
      properties:
        rank: { type: integer }
        promoterUserId: { type: string }
        displayName: { type: string }
        likeCount: { type: integer }

    BusinessKyc:
      type: object
      nullable: true
      description: A business's most recent CAC verification submission. Null when never submitted.
      properties:
        _id: { type: string }
        brandId: { type: string }
        rcNumber: { type: string }
        businessType: { type: string, enum: [RC, BN, IT] }
        legalBusinessName: { type: string }
        automatedCheck:
          type: object
          description: "Informational pre-filter only — never determines status on its own."
          properties:
            result: { type: string, enum: [not_run, match, no_match, provider_error] }
            checkedAt: { type: string, format: date-time }
            providerError: { type: string }
        documents:
          type: object
          properties:
            cacCertificateUrl: { type: string }
            repIdUrl: { type: string }
            repIdType: { type: string }
            uploadedAt: { type: string, format: date-time }
        status: { type: string, enum: [not_submitted, pending_review, verified, rejected, revoked] }
        reviewedBy: { type: string }
        reviewedAt: { type: string, format: date-time }
        rejectionReason: { type: string }
        revokedReason: { type: string }
        submittedAt: { type: string, format: date-time }
        attemptNumber: { type: integer }

    Project:
      type: object
      properties:
        _id: { type: string }
        brandId: { type: string, description: "Poster" }
        title: { type: string }
        description: { type: string }
        budgetMin: { type: number }
        budgetMax: { type: number }
        currency: { type: string }
        category: { type: string }
        deadline: { type: string, format: date-time }
        status: { type: string, enum: [open, closed, cancelled] }
        quotationCount: { type: integer, description: "Total ever submitted, regardless of paywall visibility" }
        freeQuotationId: { type: string, description: "Internal bookkeeping — read GET /projects/{id}/quotations instead of resolving this client-side" }
        createdAt: { type: string, format: date-time }

    Quotation:
      type: object
      properties:
        _id: { type: string }
        projectId: { type: string }
        brandId: { type: string, description: "Quoter" }
        amount: { type: number }
        currency: { type: string }
        message: { type: string }
        attachmentUrls: { type: array, items: { type: string } }
        status: { type: string, enum: [submitted, withdrawn] }
        withdrawnAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    BusinessRating:
      type: object
      properties:
        _id: { type: string }
        projectId: { type: string }
        quotationId: { type: string }
        raterBrandId: { type: string }
        ratedBrandId: { type: string }
        score: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        hidden: { type: boolean, description: "Always false in public reads — hidden ratings are excluded entirely, not flagged" }
        createdAt: { type: string, format: date-time }
