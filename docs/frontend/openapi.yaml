openapi: 3.0.3
info:
  title: Pazzell API
  description: >
    Billboard + Perimeter Freebie Codes platform. All paths are relative to
    /api/v1. See docs/frontend/API_GUIDE.md for a narrative walkthrough,
    DATA_MODELS.md for full shape detail, and BUSINESS_RULES.md for behavior
    that isn't obvious from the schema alone.
  version: "2.0.0"
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Profile
  - name: Billboard
  - name: Freebies
  - name: Wallet
  - name: AdCampaigns
  - name: Marketplace
  - name: PromoteAndEarn
  - name: Forum
  - name: Analytics
  - name: Admin
  - name: BusinessKYC
  - name: Projects

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- Auth
  /auth/google:
    post:
      tags: [Auth]
      security: []
      summary: Google OAuth sign-in / sign-up
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken: { type: string }
                email: { type: string }
                name: { type: string }
                avatar: { type: string }
                googleId: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Unified login (viewer or brand)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }

  /auth/viewer/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a viewer account (email/password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        "201": { description: Activation email sent, content: { application/json: { schema: { $ref: "#/components/schemas/ActivationPending" } } } }

  /auth/brand/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a brand account (email/password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        "201": { description: Activation email sent, content: { application/json: { schema: { $ref: "#/components/schemas/ActivationPending" } } } }

  /auth/user/activate:
    post:
      tags: [Auth]
      security: []
      summary: Activate a registered account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activation_token, activation_code]
              properties:
                activation_token: { type: string }
                activation_code: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "201": { description: Account created, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }

  /auth/user/resend-activation:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses:
        "200": { description: OK }

  /auth/logout:
    post:
      tags: [Auth]
      responses:
        "200": { description: OK }

  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses:
        "200": { description: Always 200 regardless of whether the email exists }

  /auth/reset-password:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 6 }
      responses:
        "200": { description: OK }

  # ---------------------------------------------------------------- Profile
  /me:
    get:
      tags: [Profile]
      summary: Cached session user
      responses:
        "200": { description: OK }

  /profile/viewer:
    get:
      tags: [Profile]
      summary: Full viewer profile with points/leaderboard stats
      responses:
        "200": { description: OK }
    put:
      tags: [Profile]
      summary: Update viewer profile (multipart, optional avatar file)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar: { type: string, format: binary }
                firstName: { type: string }
                lastName: { type: string }
                username: { type: string }
                age: { type: integer, minimum: 0, maximum: 120 }
                sex: { type: string, enum: [man, woman, prefer_not_to_say] }
                country: { type: string }
                state: { type: string }
                city: { type: string }
                phone: { type: string }
      responses:
        "200": { description: OK }

  /profile/brand:
    get:
      tags: [Profile]
      summary: Brand profile with brand details and campaign count
      responses:
        "200": { description: OK }
    put:
      tags: [Profile]
      summary: Update brand profile (multipart, optional avatar file)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar: { type: string, format: binary }
                name: { type: string }
                companyName: { type: string }
                businessCategories: { type: array, items: { type: string } }
                country: { type: string }
                state: { type: string }
                city: { type: string }
                registrationNumber: { type: string }
      responses:
        "200": { description: OK }

  /settings:
    get:
      tags: [Profile]
      responses: { "200": { description: OK } }

  /profile/change-password:
    patch:
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties: { currentPassword: { type: string }, newPassword: { type: string, minLength: 6 } }
      responses: { "200": { description: OK } }

  /profile/notifications:
    patch:
      tags: [Profile]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                emailNotifications: { type: boolean }
                leaderboardUpdates: { type: boolean }
                newCampaignAlerts: { type: boolean }
                weeklyDigest: { type: boolean }
      responses: { "200": { description: OK } }

  /profile/privacy:
    patch:
      tags: [Profile]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [showOnLeaderboard], properties: { showOnLeaderboard: { type: boolean } } } } }
      responses: { "200": { description: OK } }

  /profile/account:
    delete:
      tags: [Profile]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } }
      responses: { "200": { description: OK } }

  # ---------------------------------------------------------------- Billboard
  /billboard/session:
    post:
      tags: [Billboard]
      security: []
      summary: Mint a viewing session (works with or without auth)
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean }, sessionId: { type: string } }

  /billboard/queue:
    get:
      tags: [Billboard]
      security: []
      summary: Fetch upcoming billboard slots
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 5 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  slots: { type: array, items: { $ref: "#/components/schemas/BillboardSlot" } }
                  sponsoredAd:
                    nullable: true
                    type: object
                    description: "Persistent side-panel placement, separate from slots — admin-curated, null until an admin uploads one. See UI_CONTRACT.md's Sponsored ad panel section."
                    properties:
                      id: { type: string }
                      imageUrl: { type: string }
                      clickUrl: { type: string, nullable: true }

  /billboard/sponsored-ad/{id}/click:
    post:
      tags: [Billboard]
      security: []
      summary: Record a click on the sponsored-ad panel (fire-and-forget, idempotent)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean }, clicked: { type: boolean } }

  /billboard/impressions/heartbeat:
    post:
      tags: [Billboard]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, slotId]
              properties: { sessionId: { type: string }, slotId: { type: string }, watchedMs: { type: number } }
      responses: { "200": { description: OK } }

  /billboard/impressions/complete:
    post:
      tags: [Billboard]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, slotId]
              properties: { sessionId: { type: string }, slotId: { type: string }, watchedMs: { type: number } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean }, ok: { type: boolean }, completed: { type: boolean } }

  /billboard/impressions/click:
    post:
      tags: [Billboard]
      security: []
      summary: Fire-and-forget click-through tracking for an AD slot's clickUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, slotId]
              properties: { sessionId: { type: string }, slotId: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean }, ok: { type: boolean }, clicked: { type: boolean } }
        "400":
          description: Slot has no campaign to click through to (HOUSE/FREEBIE slot)

  /billboard/stats:
    get:
      tags: [Billboard]
      security: []
      summary: Headline watch-screen counters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  stats:
                    type: object
                    properties:
                      watchingNow: { type: integer }
                      codesToday: { type: integer }
                      adsInRotation: { type: integer }

  /billboard/my-streak:
    get:
      tags: [Billboard]
      summary: Caller's consecutive-day watch streak (hard auth required, unlike the rest of this tag)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean }, streakDays: { type: integer } }

  # ---------------------------------------------------------------- Freebies
  /freebies/strip:
    get:
      tags: [Freebies]
      security: []
      summary: Poll the perimeter strip feed (pinned codes + scrolling promo)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StripFeed" }

  /freebies/strip/events:
    get:
      tags: [Freebies]
      security: []
      summary: SSE variant of the strip feed
      responses:
        "200": { description: "text/event-stream of StripFeed payloads" }

  /freebies/phrases:
    get:
      tags: [Freebies]
      security: []
      summary: Full active phrase pool, ETag-cacheable
      responses:
        "200": { description: OK }
        "304": { description: Not modified (If-None-Match matched current ETag) }

  /freebies/recent-catches:
    get:
      tags: [Freebies]
      security: []
      summary: Small "who just won" social-proof feed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  catches:
                    type: array
                    items:
                      type: object
                      properties:
                        displayName: { type: string }
                        type: { type: string, enum: [AIRTIME, CASH] }
                        valueLabel: { type: string }
                        takenAt: { type: string, format: date-time }

  /freebies/limits/mine:
    get:
      tags: [Freebies]
      summary: Caller's today's per-type claim-cap usage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  limits:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [AIRTIME, CASH] }
                        cap: { type: integer }
                        claimedToday: { type: integer }
                        remaining: { type: integer }
                        resetsAt: { type: string, format: date-time }

  /freebies/apply:
    post:
      tags: [Freebies]
      summary: Claim a live public code, or redeem one of the caller's own secret codes
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: Retry-safe on the claim branch
        - name: X-Device-Id
          in: header
          schema: { type: string }
          description: Strongly recommended — feeds the device-ceiling anti-abuse check
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        "200":
          description: Claimed or redeemed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ClaimedResult"
                  - $ref: "#/components/schemas/RedeemedCashResult"
                  - $ref: "#/components/schemas/RedeemedAirtimeResult"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /me/claims:
    get:
      tags: [Freebies]
      summary: Full claim history — secret codes always visible
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  claims: { type: array, items: { $ref: "#/components/schemas/ClaimHistoryItem" } }

  /me/claims/{claimId}/redeem:
    post:
      tags: [Freebies]
      summary: Redeem a claim without needing its secret code (ownership proven by auth)
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Redeemed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RedeemedCashResult"
                  - $ref: "#/components/schemas/RedeemedAirtimeResult"

  # ---------------------------------------------------------------- Wallet
  /wallet/balance:
    get:
      tags: [Wallet]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/WalletBalance" } } }

  /wallet/transactions:
    get:
      tags: [Wallet]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses: { "200": { description: OK } }

  /wallet/bank-accounts:
    post:
      tags: [Wallet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountNumber, bankCode, bankName]
              properties: { accountNumber: { type: string }, bankCode: { type: string }, bankName: { type: string } }
      responses: { "201": { description: Created }, "409": { description: Already saved } }
    get:
      tags: [Wallet]
      responses: { "200": { description: OK } }

  /wallet/bank-accounts/{id}:
    delete:
      tags: [Wallet]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found } }

  # /referrals/* removed entirely — the referral feature has been retired.

  # ---------------------------------------------------------------- Ad campaigns
  /ad-campaigns:
    post:
      tags: [AdCampaigns]
      summary: "Create a campaign (brand only, multipart with a banner image file — was video, see MIGRATION_NOTES.md)"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, description, tier, banner]
              properties:
                banner: { type: string, format: binary, description: "jpeg/png/webp, close to 1200x675px (16:9), under Config: banner.maxSizeBytes (5MB default)." }
                title: { type: string }
                description: { type: string }
                tier: { type: string, enum: [basic, premium] }
                brandUrl: { type: string, description: "Must be a well-formed http(s) URL if set — becomes a clickable link on the billboard (see BillboardSlot.clickUrl). 400 otherwise." }
                campaignUrl: { type: string, description: "Same http(s)-only validation as brandUrl; takes priority over brandUrl for clickUrl when both are set." }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AdCampaign" } } } }
        "400": { description: "Missing/invalid field, including a brandUrl/campaignUrl that isn't a valid http(s) URL" }
    get:
      tags: [AdCampaigns]
      summary: "List all campaigns (admin only) — each item includes reportCount, reportCountLastHour, flagged/flaggedAt/flagReasons, brandStrikeCount, brandSuspended"
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: tier, in: query, schema: { type: string } }
      responses: { "200": { description: OK } }

  /ad-campaigns/{campaignId}/banner:
    post:
      tags: [AdCampaigns]
      summary: "Add or replace the banner on an already-existing campaign (brand only, own campaign) — the update path; POST /ad-campaigns only sets it at creation. Deletes the previous banner file from storage on a successful replace."
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [banner]
              properties:
                banner: { type: string, format: binary, description: "jpeg/png/webp, close to 1200x675px (16:9), under Config: banner.maxSizeBytes (5MB default)." }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdCampaign" } } } }
        "400": { description: "Missing/invalid banner file" }
        "403": { description: "Campaign belongs to a different brand" }
        "404": { description: Not found }

  /ad-campaigns/mine:
    get:
      tags: [AdCampaigns]
      summary: "List the calling brand's own campaigns — each item includes playsToday, completionRateToday"
      responses: { "200": { description: OK } }

  /ad-campaigns/{campaignId}:
    get:
      tags: [AdCampaigns]
      security: []
      parameters: [{ name: campaignId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdCampaign" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /ad-campaigns/{campaignId}/pause:
    post:
      tags: [AdCampaigns]
      summary: Brand self-serve pause of their own campaign — ACTIVE to PAUSED, no penalty
      parameters: [{ name: campaignId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdCampaign" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /ad-campaigns/{campaignId}/resume:
    post:
      tags: [AdCampaigns]
      summary: "Brand self-serve resume — PAUSED to ACTIVE, only if brand-paused (403 ADMIN_TAKEDOWN if admin-paused)"
      parameters: [{ name: campaignId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdCampaign" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: "ADMIN_TAKEDOWN or BRAND_SUSPENDED", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /ad-campaigns/{campaignId}/report:
    post:
      tags: [AdCampaigns]
      summary: Viewer report against a running campaign — one per user per campaign, idempotent
      parameters: [{ name: campaignId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean }, reported: { type: boolean }, flagged: { type: boolean } }

  /ad-campaigns/{campaignId}/warn:
    post:
      tags: [AdCampaigns]
      summary: Add a strike to the campaign's brand without taking the campaign down (admin only)
      parameters: [{ name: campaignId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [note], properties: { note: { type: string } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  campaign: { type: object, description: "Updated AdCampaign — see the AdCampaign schema's `campaign` property shape" }
                  strikeCount: { type: integer }
                  autoSuspended: { type: boolean }

  /ad-campaigns/deactivate:
    post:
      tags: [AdCampaigns]
      summary: Bulk-pull live campaigns out of rotation (admin only); adds one strike per campaign to its brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaignIds, reason]
              properties:
                campaignIds: { type: array, items: { type: string } }
                reason: { type: string, description: "Required — logged against the strike this adds to each affected brand" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  matched: { type: integer }
                  deactivated: { type: integer }

  /ad-campaigns/reactivate:
    post:
      tags: [AdCampaigns]
      summary: Bulk-restore previously-deactivated campaigns to rotation (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaignIds]
              properties:
                campaignIds: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  matched: { type: integer }
                  reactivated: { type: integer }
                  skippedExpired: { type: array, items: { type: string } }

  /ad-campaigns/{campaignId}/analytics:
    get:
      tags: [AdCampaigns]
      summary: "Campaign analytics summary + time series (Premium tier only, 403 on Basic) — includes costPerCompletedView, clicks, clickThroughRate"
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses: { "200": { description: OK }, "403": { $ref: "#/components/responses/Error" } }

  /ad-campaigns/{campaignId}/analytics/breakdown:
    get:
      tags: [AdCampaigns]
      summary: "Combinable demographic breakdown, cohort-suppressed below Config: analytics.minCohort"
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string } }
        - { name: dimension, in: query, required: true, schema: { type: string, enum: [country, state, sex, ageBand, device, hour] } }
        - { name: country, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: sex, in: query, schema: { type: string } }
        - { name: ageBand, in: query, schema: { type: string } }
        - { name: device, in: query, schema: { type: string } }
      responses: { "200": { description: OK } }

  /ad-campaigns/{campaignId}/analytics/export.csv:
    get:
      tags: [AdCampaigns]
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses: { "200": { description: "text/csv" } }

  /ad-payments/initialize:
    post:
      tags: [AdCampaigns]
      summary: Start Paystack checkout for a campaign's flat tier price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaignId, email]
              properties: { campaignId: { type: string }, email: { type: string } }
      responses:
        "200": { description: OK }
        "403": { description: "PROFILE_INCOMPLETE — brand profile not complete yet" }

  /ad-payments/verify/{reference}:
    get:
      tags: [AdCampaigns]
      parameters: [{ name: reference, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "400": { description: Verification failed } }

  # -------------------------------------------------- Marketplace (business directory, no checkout)
  /marketplace/business/profile/mine:
    get:
      tags: [Marketplace]
      summary: The calling brand's own directory profile, regardless of isListed
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/BusinessProfileResponse" } } }
        "404": { $ref: "#/components/responses/Error" }

  /marketplace/business/profile:
    put:
      tags: [Marketplace]
      summary: Create/update the calling brand's directory profile (brand only)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logo: { type: string, format: binary }
                coverImage: { type: string, format: binary }
                logoUrl: { type: string, description: "Alternative to uploading a file" }
                coverImageUrl: { type: string }
                businessName: { type: string }
                businessDescription: { type: string }
                contactEmail: { type: string }
                contactPhone: { type: string }
                whatsappNumber: { type: string }
                address: { type: string }
                socialLinks:
                  type: object
                  properties:
                    website: { type: string }
                    instagram: { type: string }
                    facebook: { type: string }
                    twitter: { type: string }
                    tiktok: { type: string }
                    linkedin: { type: string }
                    youtube: { type: string }
                isListed: { type: boolean }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/BusinessProfileResponse" } } }
        "400":
          description: "PROFILE_NOT_LISTABLE — tried to set isListed:true without a name and a contact method"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /marketplace/businesses:
    get:
      tags: [Marketplace]
      security: []
      summary: Public directory browse/search — isListed:true businesses only
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  businesses: { type: array, items: { $ref: "#/components/schemas/BusinessProfile" } }

  /marketplace/businesses/{brandId}:
    get:
      tags: [Marketplace]
      security: []
      summary: A listed business's full profile plus its active products
      parameters: [{ name: brandId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  business: { $ref: "#/components/schemas/BusinessProfile" }
                  products: { type: array, items: { $ref: "#/components/schemas/MarketplaceProduct" } }
        "404":
          description: Business not found or not listed — the two are never distinguished
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /marketplace/products/mine:
    get:
      tags: [Marketplace]
      summary: The calling brand's own listings, including inactive ones
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  products: { type: array, items: { $ref: "#/components/schemas/MarketplaceProduct" } }

  /marketplace/products:
    post:
      tags: [Marketplace]
      summary: Create a showcase product/service (brand only) — no price/checkout fields
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, description, category]
              properties:
                images: { type: array, items: { type: string, format: binary }, description: "Up to 6 photos" }
                name: { type: string }
                description: { type: string }
                category: { type: string }
                priceLabel: { type: string, description: 'Free display text, e.g. "From ₦5,000" — never a charged amount' }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, product: { $ref: "#/components/schemas/MarketplaceProduct" } } } } }
    get:
      tags: [Marketplace]
      security: []
      summary: Public browse — active products belonging to currently-listed businesses only
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: brandId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  products: { type: array, items: { $ref: "#/components/schemas/MarketplaceProduct" } }

  /marketplace/products/{productId}:
    get:
      tags: [Marketplace]
      security: []
      summary: Product detail, with the owning business's contact info denormalized in
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  product: { $ref: "#/components/schemas/MarketplaceProduct" }
                  business: { $ref: "#/components/schemas/BusinessProfile" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Marketplace]
      summary: Update a product/service (brand only, own listings only)
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images: { type: array, items: { type: string, format: binary } }
                name: { type: string }
                description: { type: string }
                category: { type: string }
                priceLabel: { type: string }
                isActive: { type: boolean }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Marketplace]
      summary: Delete a product/service (brand only, own listings only)
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ Promote & Earn
  /promote/campaigns:
    post:
      tags: [PromoteAndEarn]
      summary: Post a Promote & Earn campaign (brand only). Free — no payment, auto-ACTIVE.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [media, title, description]
              properties:
                media: { type: string, format: binary }
                title: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean }, campaign: { $ref: "#/components/schemas/PromoCampaign" } }
    get:
      tags: [PromoteAndEarn]
      summary: List all Promote & Earn campaigns (admin only)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, PAUSED] } }
        - { name: brandId, in: query, schema: { type: string } }
      responses: { "200": { description: OK } }

  /promote/campaigns/mine:
    get:
      tags: [PromoteAndEarn]
      summary: List the calling brand's own campaigns
      responses: { "200": { description: OK } }

  /promote/campaigns/deactivate:
    post:
      tags: [PromoteAndEarn]
      summary: Bulk-pause ACTIVE campaigns (admin only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [campaignIds]
              properties:
                campaignIds: { type: array, items: { type: string } }
                reason: { type: string }
      responses: { "200": { description: OK } }

  /promote/campaigns/reactivate:
    post:
      tags: [PromoteAndEarn]
      summary: Bulk-restore PAUSED campaigns to ACTIVE (admin only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [campaignIds]
              properties: { campaignIds: { type: array, items: { type: string } } }
      responses: { "200": { description: OK } }

  /promote/campaigns/{campaignId}:
    get:
      tags: [PromoteAndEarn]
      security: []
      summary: Campaign detail — what a shared link's landing page reads
      parameters: [{ name: campaignId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean }, campaign: { $ref: "#/components/schemas/PromoCampaign" } }
        "404": { $ref: "#/components/responses/Error" }

  /promote/campaigns/{campaignId}/links:
    post:
      tags: [PromoteAndEarn]
      summary: Mint or return this viewer's share link for a campaign (idempotent)
      parameters: [{ name: campaignId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean }, link: { $ref: "#/components/schemas/PromoLink" } }

  /promote/links/mine:
    get:
      tags: [PromoteAndEarn]
      summary: Every share link this viewer holds, across every campaign, each with its clickCount/signupCount/likeCount funnel
      responses: { "200": { description: OK } }

  /promote/l/{slug}:
    get:
      tags: [PromoteAndEarn]
      security: []
      summary: Resolve a share link's slug to campaign detail, and log a funnel click for this browser (deduped per browser per link)
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  campaignId: { type: string }
                  linkId: { type: string }
                  promoterUserId: { type: string }
                  campaign: { $ref: "#/components/schemas/PromoCampaign" }
        "404": { $ref: "#/components/responses/Error" }

  /promote/like/{slug}:
    post:
      tags: [PromoteAndEarn]
      summary: Vote/like the campaign a share link points to. No account-age gate. Idempotent — one vote per user per (promoter, campaign) pair.
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: "OK — alreadyLiked:true + message on a repeat vote for the same promoter+campaign pair, not an error"
        "400": { description: "SELF_LIKE_NOT_ALLOWED | CAMPAIGN_NOT_ACTIVE" }
        "404": { description: LINK_NOT_FOUND }

  /promote/leaderboard:
    get:
      tags: [PromoteAndEarn]
      security: []
      summary: Platform-wide leaderboard, cumulative across every campaign each promoter has shared
      parameters:
        - { name: periodId, in: query, schema: { type: string }, description: "Omit for the currently OPEN period" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  period: { $ref: "#/components/schemas/PromoPrizePeriod" }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/PromoLeaderboardEntry" }

  /admin/promote/likes/{likeId}/void:
    post:
      tags: [PromoteAndEarn]
      summary: Discount one like from every leaderboard computation (admin only)
      parameters: [{ name: likeId, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses: { "200": { description: OK } }

  /admin/promote/promoters/{userId}/disqualify:
    post:
      tags: [PromoteAndEarn]
      summary: Exclude a promoter from every leaderboard computation, globally (admin only)
      parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses: { "200": { description: OK } }

  /admin/promote/promoters/{userId}/requalify:
    post:
      tags: [PromoteAndEarn]
      summary: Undo a disqualification (admin only)
      parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /admin/promote/promoters/disqualified:
    get:
      tags: [PromoteAndEarn]
      summary: List currently disqualified promoters (admin only)
      responses: { "200": { description: OK } }

  /admin/promote/periods:
    post:
      tags: [PromoteAndEarn]
      summary: Open a grand-prize window (admin only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [periodStart, periodEnd, prizeDescription]
              properties:
                periodStart: { type: string, format: date-time }
                periodEnd: { type: string, format: date-time }
                prizeDescription: { type: string }
                prizeAmount: { type: number }
                currency: { type: string }
      responses: { "201": { description: Created } }
    get:
      tags: [PromoteAndEarn]
      summary: List all prize periods (admin only)
      responses: { "200": { description: OK } }

  /admin/promote/periods/{periodId}/settle:
    post:
      tags: [PromoteAndEarn]
      summary: Determine the winner and credit their wallet if prizeAmount was set (admin only)
      parameters: [{ name: periodId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /admin/promote/periods/{periodId}/cancel:
    post:
      tags: [PromoteAndEarn]
      summary: Cancel an OPEN period without settling it (admin only)
      parameters: [{ name: periodId, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses: { "200": { description: OK } }

  # ---------------------------------------------------------------- Analytics
  /analytics/app:
    get:
      tags: [Analytics]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  analytics:
                    type: object
                    properties:
                      totalAdsWatched: { type: integer }
                      adsWatchedToday: { type: integer }
                      currentlyPlaying: { type: integer }
                      onlineUsers: { type: integer }

  # ---------------------------------------------------------------- Admin
  /admin/brands/{brandId}/suspend:
    post:
      tags: [Admin, AdCampaigns]
      summary: Suspend a brand — pauses every ACTIVE campaign they have running
      parameters: [{ name: brandId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean }, pausedCampaigns: { type: integer } }

  /admin/brands/{brandId}/unsuspend:
    post:
      tags: [Admin, AdCampaigns]
      summary: "Lift a suspension — does not reset strikeCount or reactivate paused campaigns"
      parameters: [{ name: brandId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /sponsored-ads/submit:
    post:
      tags: [Billboard]
      security: []
      summary: "Submit a sponsored-ad creative for review (public, no auth) — any advertiser, registered on the platform or not. Always lands PENDING; never goes live without an admin reviewing/negotiating and activating it."
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [advertiserName, contactEmail, image]
              properties:
                image: { type: string, format: binary, description: "jpeg/png/webp/gif, under Config: sponsoredAd.maxSizeBytes (5MB default). No aspect-ratio constraint." }
                advertiserName: { type: string }
                contactEmail: { type: string, description: "Required — how the team follows up to negotiate. Must look like a valid email." }
                contactPhone: { type: string }
                message: { type: string, description: "Free text — what they're advertising, budget expectations, etc." }
                clickUrl: { type: string, description: "Must be a well-formed http(s) URL if set." }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  submissionId: { type: string }
        "400": { description: "Missing image/advertiserName/contactEmail, or an invalid contactEmail/clickUrl" }
        "429": { description: Too many submissions from this IP — see Config rateLimit.sponsoredAdSubmission }

  /admin/sponsored-ads:
    post:
      tags: [Admin, Billboard]
      summary: "Upload a sponsored-ad creative (admin only) — goes live (ACTIVE) immediately. Not a brand self-serve flow; the advertiser negotiates off-platform and an admin uploads the already-agreed creative. Contrast with the public POST /sponsored-ads/submit, which lands PENDING for review instead."
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [advertiserName, image]
              properties:
                image: { type: string, format: binary, description: "jpeg/png/webp/gif, under Config: sponsoredAd.maxSizeBytes (5MB default). No aspect-ratio constraint." }
                advertiserName: { type: string }
                clickUrl: { type: string, description: "Must be a well-formed http(s) URL if set." }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SponsoredAdResponse" } } } }
        "400": { description: "Missing image/advertiserName, or an invalid creative/clickUrl" }
        "403": { description: Not an admin }
    get:
      tags: [Admin, Billboard]
      summary: "List sponsored ads (admin only) — optionally filtered by status"
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, ACTIVE, INACTIVE] }
          description: "Pass PENDING to pull up just the brand-submitted queue awaiting review; omit for everything."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  sponsoredAds: { type: array, items: { $ref: "#/components/schemas/SponsoredAd" } }

  /admin/sponsored-ads/{id}/activate:
    post:
      tags: [Admin, Billboard]
      summary: Set a sponsored ad's status to ACTIVE (admin only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SponsoredAdResponse" } } } }
        "404": { description: Not found }

  /admin/sponsored-ads/{id}/deactivate:
    post:
      tags: [Admin, Billboard]
      summary: Set a sponsored ad's status to INACTIVE (admin only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SponsoredAdResponse" } } } }
        "404": { description: Not found }

  /admin/dashboard:
    get:
      tags: [Admin]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminDashboard" } } }

  /admin/config:
    get:
      tags: [Admin]
      responses: { "200": { description: OK } }

  /admin/config/{key}:
    put:
      tags: [Admin]
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties: { value: {}, description: { type: string } }
      responses: { "200": { description: OK }, "400": { description: Unknown config key } }

  # /admin/freebie-prizes/batch/airtime removed — cash-only cutover, see
  # BUSINESS_RULES.md. batch/cash below is the only creation endpoint now.

  /admin/freebie-prizes/batch/cash:
    post:
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prizes:
                  type: array
                  items: { type: object, properties: { value: { type: number }, currency: { type: string } } }
      responses: { "201": { description: Created } }

  /admin/freebie-prizes:
    get:
      tags: [Admin]
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [AIRTIME, CASH] } }
        - { name: status, in: query, schema: { type: string } }
      responses: { "200": { description: OK } }

  /admin/freebie-prizes/low-inventory:
    get:
      tags: [Admin]
      responses: { "200": { description: OK } }

  /admin/freebie-prizes/{prizeItemId}:
    get:
      tags: [Admin]
      parameters: [{ name: prizeItemId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found } }

  /admin/freebie-prizes/{prizeItemId}/void:
    post:
      tags: [Admin]
      parameters: [{ name: prizeItemId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } }
      responses: { "200": { description: OK } }

  /admin/freebie-prizes/{prizeItemId}/reveal-pin:
    post:
      tags: [Admin]
      summary: The one explicit, audit-logged path a PIN is exposed outside a real redemption
      parameters: [{ name: prizeItemId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /admin/freebies/schedule:
    get:
      tags: [Admin]
      parameters: [{ name: date, in: query, required: true, schema: { type: string, format: date } }]
      responses: { "200": { description: OK } }

  /admin/freebies/schedule/generate:
    post:
      tags: [Admin]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [date], properties: { date: { type: string, format: date } } } } }
      responses: { "201": { description: Created } }

  /admin/freebies/schedule/{scheduleId}/cancel:
    post:
      tags: [Admin]
      parameters: [{ name: scheduleId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } }
      responses: { "200": { description: OK } }

  /admin/freebies/force-live:
    post:
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [type], properties: { type: { type: string, enum: [AIRTIME, CASH] } } }
      responses: { "201": { description: Created } }

  /admin/phrases:
    get:
      tags: [Admin]
      parameters: [{ name: slot, in: query, schema: { type: string } }]
      responses: { "200": { description: OK } }
    post:
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot, text]
              properties:
                slot: { type: string, enum: [PROMO, FREEBIE_LIVE, FREEBIE_GONE, WELCOME, EMPTY_STATE] }
                text: { type: string }
                weight: { type: number }
      responses: { "201": { description: Created } }

  /admin/phrases/{phraseId}:
    put:
      tags: [Admin]
      parameters: [{ name: phraseId, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { text: { type: string }, weight: { type: number }, active: { type: boolean } }
      responses: { "200": { description: OK } }
    delete:
      tags: [Admin]
      parameters: [{ name: phraseId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /admin/claims:
    get:
      tags: [Admin]
      parameters:
        - { name: secretCode, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
      responses: { "200": { description: OK } }

  /admin/claims/{claimId}/void:
    post:
      tags: [Admin]
      parameters: [{ name: claimId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } }
      responses: { "200": { description: OK } }

  /admin/payout-runs:
    get:
      tags: [Admin]
      responses: { "200": { description: OK } }
    post:
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodStart, periodEnd]
              properties: { periodStart: { type: string, format: date-time }, periodEnd: { type: string, format: date-time } }
      responses: { "201": { description: Created } }

  /admin/payout-runs/{runId}/items:
    get:
      tags: [Admin]
      parameters: [{ name: runId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /admin/payout-runs/{runId}/lock:
    post:
      tags: [Admin]
      parameters: [{ name: runId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /admin/payout-runs/{runId}/export.csv:
    get:
      tags: [Admin]
      parameters: [{ name: runId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "text/csv" } }

  /admin/payout-runs/{runId}/items/{itemId}/paid:
    post:
      tags: [Admin]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { method: { type: string }, reference: { type: string } } } } }
      responses: { "200": { description: OK } }

  /admin/payout-runs/{runId}/items/paid-bulk:
    post:
      tags: [Admin]
      parameters: [{ name: runId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds: { type: array, items: { type: string } }
                method: { type: string }
                reference: { type: string }
      responses: { "200": { description: OK } }

  /admin/payout-runs/{runId}/items/{itemId}/skip:
    post:
      tags: [Admin]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } }
      responses: { "200": { description: OK } }

  /admin/payout-runs/{runId}/items/{itemId}/fail:
    post:
      tags: [Admin]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } }
      responses: { "200": { description: OK } }

  /admin/payout-runs/{runId}/complete:
    post:
      tags: [Admin]
      parameters: [{ name: runId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  # ---------------------------------------------------------------- Forum
  /forum/threads:
    get:
