        required: true
        content: { application/json: { schema: { type: object } } }
      responses: { "201": { description: Created } }

  /forum/threads/{id}/posts:
    get:
      tags: [Forum]
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }
    post:
      tags: [Forum]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses: { "201": { description: Created } }

  /forum/posts/{id}/like:
    post:
      tags: [Forum]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }
    delete:
      tags: [Forum]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /forum/posts/{id}/flag:
    post:
      tags: [Forum]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
